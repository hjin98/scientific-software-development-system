[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssds"
version = "8.0.0.dev0"
description = "SSDS: scientific software development orchestration (Level 0 Core and the SSDS 8 shadow components)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SSDS" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "python-frontmatter>=1.1",
    "packaging>=23.0",
    "cryptography>=42",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8"]

[project.scripts]
ssds = "ssds.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ssds*"]
namespaces = false

[tool.setuptools.package-data]
"ssds.core" = ["resources/protocol/*/*.md", "resources/protocol/*/*.json"]
